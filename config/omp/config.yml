# oh-my-pi (omp) global settings. Linked to ~/.omp/agent/config.yml as an
# out-of-store symlink by modules/omp.nix, so edits apply immediately and
# runtime /settings writes land here (review them in `git diff`).
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/settings.md
# String enum values are quoted so YAML never reads `off`/`on` as booleans.

# Models mirror pi: modules/dotfiles.nix pi.defaultModel and subagentModels.
defaultThinkingLevel: high
modelRoles:
  default: anthropic/claude-opus-5-5
  slow: anthropic/claude-opus-5-5
  smol: anthropic/claude-haiku-5-5
  advisor: anthropic/claude-sonnet-5-5:medium
  # Same backend pi's web_search uses without API keys (Exa's keyless MCP);
  # keeps searches off the Anthropic subscription and browser scrapers.
  web: web/exa
retry:
  fallbackChains:
    web:
      - web/duckduckgo
      - web/startpage

# pi compacts Opus 5.5 at 500K (reserveTokens = 1M - 500K). Fixed trigger;
# below the 1M standard window, so it does not enable extended context.
compaction:
  modelThresholds:
    anthropic/claude-opus-5-5: "f500000"

task:
  # Only the repository agents generated by modules/omp.nix are used; user
  # scout/reviewer shadow the bundled ones, the rest are disabled. Every task
  # call must name an agent.
  disabledAgents:
    - task
    - sonic
    - security-reviewer
  maxRecursionDepth: 1 # pi maxSubagentDepth: 1

# Safety. Mirrors config/pi/permission-system.json; keep both in sync (see
# AGENTS.md). Accepted limitations, revisit if the trial continues:
# - bash.patterns is a hand-maintained copy with no automated drift check.
# - Patterns govern only the bash tool. eval (Python/JS) is allowed and can
#   spawn shells that bypass them; pi's bash rules are equally bypassable.
# - omp has no path-pattern read deny: in-repo .env*, *.pem, *.key, and
#   secret(s) paths are readable. restrictedFolders below covers home secrets.
# - MCP approvals are exact tool names; tools added upstream are not covered.
# - In yolo, omp's built-in critical-command overrides are ignored; only the
#   explicit patterns below apply. Subagents fail on any prompt rule.
tools:
  approvalMode: yolo
  # Every access prompts in every mode; subagents are refused.
  restrictedFolders:
    - ~/.secrets
    - ~/.ssh
    - ~/.aws
    - ~/.omp/agent # agent.db holds omp credentials
    - ~/.pi/agent # auth.json holds pi credentials
    - ~/.claude.json
  # pi mcp rules: *delete*, *merge*, *push*, *terminate*, *deregister*, and
  # GitHub/Notion write tools. Names follow mcp__<server>_<tool>. Work-server
  # names come from upstream tool lists and need confirming with `/mcp list`
  # on the work host.
  approval:
    mcp__github_create_or_update_file: prompt
    mcp__github_delete_file: prompt
    mcp__github_fork_repository: prompt
    mcp__github_merge_pull_request: prompt
    mcp__github_push_files: prompt
    # Work only: kubernetes-mcp-server
    mcp__kubernetes_pods_delete: prompt
    mcp__kubernetes_resources_delete: prompt
    # Work only: Notion hosted MCP (notion-* tools lose the server prefix)
    mcp__notion_move_pages: prompt
    mcp__notion_delete_pages: prompt
    mcp__notion_delete_databases: prompt
    mcp__notion_delete_comment: prompt
    # Work only: incident.io
    mcp__incident_io_action_delete: prompt
    mcp__incident_io_incident_merge: prompt
    mcp__incident_io_incident_unmerge: prompt
    mcp__incident_io_maintenance_window_delete: prompt
    mcp__incident_io_notification_pause_delete: prompt
    mcp__incident_io_schedule_override_delete: prompt
    # Work only: Datadog
    mcp__datadog_delete_apm_sampling_rule: prompt
    mcp__datadog_delete_apm_service_remapping_rule: prompt
    mcp__datadog_delete_datadog_dashboard: prompt
    mcp__datadog_delete_datadog_log_archive: prompt
    mcp__datadog_delete_datadog_log_index: prompt
    mcp__datadog_delete_datadog_log_pipeline: prompt
    mcp__datadog_delete_datadog_notebook: prompt
    mcp__datadog_delete_datadog_security_aap_custom_rule: prompt
    mcp__datadog_delete_datadog_security_detection_rules: prompt
    mcp__datadog_delete_datadog_security_findings_automation_rule: prompt
    mcp__datadog_delete_datadog_security_iac_custom_rule: prompt
    mcp__datadog_delete_datadog_security_suppression: prompt
    mcp__datadog_delete_datadog_security_trace_passlist: prompt
    mcp__datadog_delete_datadog_spreadsheet: prompt
    mcp__datadog_delete_datadog_workflow: prompt
    mcp__datadog_delete_derived_metric: prompt
    mcp__datadog_delete_rum_metric: prompt
    mcp__datadog_delete_rum_operation: prompt
    mcp__datadog_delete_rum_retention_filter: prompt
    mcp__datadog_delete_tag_rule: prompt
    # aws-mcp runs commands through a generic tool; names cannot gate deletes.

# First match wins: allow exceptions, then deny, then prompt. deny/prompt also
# match segments of compound commands. Copied from permission-system.json
# (ask -> prompt).
bash:
  patterns:
    - { match: "git restore --staged -- *", approval: allow }
    - { match: "git restore -S -- *", approval: allow }
    - { match: "rm -rf ~", approval: deny }
    - { match: "rm -rf ~/*", approval: deny }
    - { match: "sudo rm -rf ~", approval: deny }
    - { match: "sudo rm -rf ~/*", approval: deny }
    - { match: "rm /nix*", approval: deny }
    - { match: "rm * /nix*", approval: deny }
    - { match: "sudo rm /nix*", approval: deny }
    - { match: "sudo rm * /nix*", approval: deny }
    - { match: "dd *", approval: deny }
    - { match: "sudo dd *", approval: deny }
    - { match: "mkfs *", approval: deny }
    - { match: "mkfs.*", approval: deny }
    - { match: "sudo mkfs *", approval: deny }
    - { match: "sudo mkfs.*", approval: deny }
    - { match: "fdisk *", approval: deny }
    - { match: "sudo fdisk *", approval: deny }
    - { match: "parted *", approval: deny }
    - { match: "sudo parted *", approval: deny }
    - { match: "wipefs *", approval: deny }
    - { match: "sudo wipefs *", approval: deny }
    - { match: "diskutil erase*", approval: deny }
    - { match: "diskutil apfs delete *", approval: deny }
    - { match: "chmod * /nix*", approval: deny }
    - { match: "sudo chmod * /nix*", approval: deny }
    - { match: "chmod * -R * 777*", approval: deny }
    - { match: "chmod * 777* -R *", approval: deny }
    - { match: "sudo chmod * -R * 777*", approval: deny }
    - { match: "chmod -R 777 *", approval: deny }
    - { match: "chmod -R 777*", approval: deny }
    - { match: "sudo chmod -R 777 *", approval: deny }
    - { match: "sudo chmod -R 777*", approval: deny }
    - { match: "chown * -R /*", approval: deny }
    - { match: "chown * -R ~*", approval: deny }
    - { match: "sudo chown * -R /*", approval: deny }
    - { match: "sudo chown * -R ~*", approval: deny }
    - { match: "chown -R * /*", approval: deny }
    - { match: "chown -R * ~*", approval: deny }
    - { match: "sudo chown -R * /*", approval: deny }
    - { match: "sudo chown -R * ~*", approval: deny }
    - { match: "reboot", approval: deny }
    - { match: "reboot *", approval: deny }
    - { match: "sudo reboot", approval: deny }
    - { match: "sudo reboot *", approval: deny }
    - { match: "shutdown", approval: deny }
    - { match: "shutdown *", approval: deny }
    - { match: "sudo shutdown", approval: deny }
    - { match: "sudo shutdown *", approval: deny }
    - { match: "sudo rm", approval: prompt }
    - { match: "sudo rm *", approval: prompt }
    - { match: "git push", approval: prompt }
    - { match: "git push *", approval: prompt }
    - { match: "git * push*", approval: prompt }
    - { match: "git reset --hard", approval: prompt }
    - { match: "git reset --hard *", approval: prompt }
    - { match: "git * reset --hard*", approval: prompt }
    - { match: "git clean *-f*", approval: prompt }
    - { match: "git * clean *-f*", approval: prompt }
    - { match: "git checkout -- *", approval: prompt }
    - { match: "git * checkout -- *", approval: prompt }
    - { match: "git restore *", approval: prompt }
    - { match: "git * restore *", approval: prompt }
    - { match: "git tag -d *", approval: prompt }
    - { match: "git * tag -d *", approval: prompt }
    - { match: "git branch -D *", approval: prompt }
    - { match: "git * branch -D *", approval: prompt }
    - { match: "terraform apply", approval: prompt }
    - { match: "terraform apply *", approval: prompt }
    - { match: "terraform * apply*", approval: prompt }
    - { match: "terraform destroy", approval: prompt }
    - { match: "terraform destroy *", approval: prompt }
    - { match: "terraform * destroy*", approval: prompt }
    - { match: "terraform * delete*", approval: prompt }
    - { match: "terraform state rm *", approval: prompt }
    - { match: "tofu apply", approval: prompt }
    - { match: "tofu apply *", approval: prompt }
    - { match: "tofu * apply*", approval: prompt }
    - { match: "tofu destroy", approval: prompt }
    - { match: "tofu destroy *", approval: prompt }
    - { match: "tofu * destroy*", approval: prompt }
    - { match: "tofu * delete*", approval: prompt }
    - { match: "tofu state rm *", approval: prompt }
    - { match: "kubectl delete *", approval: prompt }
    - { match: "kubectl * delete*", approval: prompt }
    - { match: "kubectl drain *", approval: prompt }
    - { match: "kubectl * drain*", approval: prompt }
    - { match: "helm delete *", approval: prompt }
    - { match: "helm * delete*", approval: prompt }
    - { match: "helm uninstall *", approval: prompt }
    - { match: "helm * uninstall*", approval: prompt }
    - { match: "aws *s3 rb *", approval: prompt }
    - { match: "aws *s3 rm *", approval: prompt }
    - { match: "aws * delete-*", approval: prompt }
    - { match: "aws * deregister-*", approval: prompt }
    - { match: "aws * detach-*", approval: prompt }
    - { match: "aws * disable-*", approval: prompt }
    - { match: "aws * remove-*", approval: prompt }
    - { match: "aws * terminate-*", approval: prompt }
    - { match: "brew uninstall *", approval: prompt }
    - { match: "brew untap *", approval: prompt }
    - { match: "brew zap *", approval: prompt }
    - { match: "npm uninstall *", approval: prompt }
    - { match: "pnpm remove *", approval: prompt }
    - { match: "pnpm uninstall *", approval: prompt }
    - { match: "yarn remove *", approval: prompt }
    - { match: "yarn uninstall *", approval: prompt }
    - { match: "pip uninstall *", approval: prompt }
    - { match: "pip3 uninstall *", approval: prompt }
    - { match: "uv pip uninstall *", approval: prompt }
    - { match: "uv tool uninstall *", approval: prompt }
    - { match: "cargo uninstall *", approval: prompt }
    - { match: "nix profile remove *", approval: prompt }
    - { match: "nix-env -e *", approval: prompt }
    - { match: "rm -rf /*", approval: prompt }
    - { match: "rm -fr /*", approval: prompt }
    - { match: "sudo rm -rf /*", approval: prompt }
    - { match: "sudo rm -fr /*", approval: prompt }

# Privacy and outbound data; most are upstream defaults, pinned explicitly.
dev:
  autoqa: false # no tool-issue reports to qa.omp.sh
update:
  auto: false # binary install; upgrade with `omp update`
spotlight:
  experiment:
    enabled: false
collab:
  autoStart: "off"

startup:
  quiet: true

theme:
  dark: dark-catppuccin
tui:
  hyperlinks: always # detection fails behind herdr, as in pi
