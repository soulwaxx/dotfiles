# Project windows live in main; secondary sessions are optional via Sesh.
set -g renumber-windows on
set -g status-position top
set -g status-justify left
set -g status-left ""
set -g status-right-length 80
set -g status-right "#{E:@catppuccin_status_session} #{E:@catppuccin_status_host}"
# Reserve a pane-border row below the bar without adding another status row.
set -g pane-border-status top
set -g pane-border-format ""
set -g pane-border-lines single

# Forward supported modified keys and OSC 8 links; see README for Cmd+w's limitation.
set -s extended-keys on
set -s extended-keys-format csi-u
# Reset before appending so prefix+r does not accumulate duplicate entries.
set -su terminal-features
set -as terminal-features ',xterm-ghostty*:RGB:usstyle:extkeys:hyperlinks,ghostty:RGB:usstyle:extkeys:hyperlinks'
# tmux copies reach the clipboard; direct application OSC 52 copies are blocked.
set -s set-clipboard external
# Needed by Neovim's Snacks image rendering; Pi still detects images itself.
set -g allow-passthrough on
set -g allow-rename off
set -g bell-action other
set -g visual-bell off

bind t choose-tree -w -Z -f '#{==:#{session_name},#{client_session}}'
# Retire the custom fzf picker binding when reloading an existing server.
unbind -q T
bind o display-popup -E -d '#{pane_current_path}' -w 80% -h 70% -T sesh 'sesh picker -i'
bind r source-file ~/.config/tmux/tmux.conf \; display '  Config reloaded'
bind c new-window -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind a last-window
bind C-p previous-window
bind C-n next-window
bind X confirm-before -p 'Kill window #W? (y/n)' kill-window

bind Space display-menu -T '#[align=centre] tmux ' -x C -y C \
  'Split right'       '|' "split-window -h -c '#{pane_current_path}'" \
  'Split down'        '-' "split-window -v -c '#{pane_current_path}'" \
  'New window'        'c' "new-window -c '#{pane_current_path}'" \
  '' \
  'Zoom pane'         'z' 'resize-pane -Z' \
  'Copy mode'         'v' 'copy-mode' \
  'Clear scrollback'  'C' 'clear-history' \
  'Save pane history' 'H' "command-prompt -p 'Save to:' -I '~/tmux-#S-#I.log' 'capture-pane -S -100000 ; save-buffer %%'" \
  'Break pane'        'b' 'break-pane -d' \
  'Paste buffers'     'P' 'choose-buffer -Z' \
  'Join pane'         'j' "choose-window 'join-pane -h -s %%'" \
  'Next layout'       'L' 'next-layout' \
  'Kill other panes'  'K' "confirm-before -p 'Kill all other panes in #W? (y/n)' 'kill-pane -a'" \
  '' \
  'Kill pane'         'x' "confirm-before -p 'Kill pane #P? (y/n)' 'kill-pane'" \
  'Kill window'       'X' "confirm-before -p 'Kill window #W? (y/n)' 'kill-window'" \
  '' \
  'Session tree'      't' 'choose-tree -Zw' \
  'Choose session'    's' 'choose-tree -s' \
  'Recall session'    'R' "display-popup -E -d '#{pane_current_path}' -w80% -h70% -T 'sesh' 'sesh picker -i'" \
  'Last session'      'o' 'switch-client -l' \
  'Rename session'    '$' "command-prompt -I '#S' 'rename-session %%'" \
  'Choose window'     'w' 'choose-window' \
  'Rename window'     ',' "command-prompt -I '#W' 'rename-window %%'" \
  'New session'       'n' "command-prompt -I 'home' 'new-session -Ad -s %% -c \"#{pane_current_path}\" \\; switch-client -t %%'" \
  '' \
  'Toggle sync panes' 'S' 'setw synchronize-panes' \
  'Toggle status bar' 'T' 'set -g status' \
  'Toggle pane borders' 'B' "if -F '#{==:#{pane-border-status},off}' 'set -g pane-border-status top' 'set -g pane-border-status off'" \
  'Reload config'     'r' "source-file ~/.config/tmux/tmux.conf \\; display '  Config reloaded'"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T root MouseDrag1Pane if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -M'
bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T root WheelUpPane if -Ft= '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -e'
bind -T root WheelDownPane if -Ft= '#{pane_in_mode}' 'send -M' 'send -M'
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# TPM owns these writable checkouts. Catppuccin's release pin is intentional.
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @floax-bind 'p'
set -g @floax-bind-menu 'P'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'
set -g @floax-title 'scratch'
set -g @floax-border-color '#cba6f7'
set -g @floax-text-color '#89b4fa'
set -g @fzf-url-bind 'u'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_host_text ' #h'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #{?#{m/r:^(ba|z|fi)?sh$,#{pane_current_command}}, ,}#W'
set -g @catppuccin_window_current_text ' #{?#{m/r:^(ba|z|fi)?sh$,#{pane_current_command}}, ,}#W'
set -g @catppuccin_window_flags 'icon'

set -g @tmux_window_name_icon_style 'dir_and_icon'
set -g @tmux_window_name_show_program_args 'False'
set -g @tmux_window_name_ignore_program_diffs 'True'
set -g @tmux_window_name_max_name_len '60'
set -g @tmux_window_name_dir_programs "['nvim', 'vim', 'vi', 'git', 'pi', 'claude', 'node', 'python', 'python3', 'ssh', 'btop', 'k9s']"
set -g @tmux_window_name_custom_icons "{'pi': '󰚩', 'claude': '󰚩', 'python3': '', 'ssh': '󰣀', 'btop': '', 'k9s': '󱃾'}"
