# Each Ghostty tab/window creates a session; use Sesh to reconnect to one.
set -g default-terminal 'tmux-256color'
source-file -q ~/.config/tmux/environment.conf

# Explicit core settings, independent of Home Manager's tmux defaults.
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g aggressive-resize off
setw -g clock-mode-style 12
set -s escape-time 10
set -g status-interval 15
set -g status-keys emacs
set -g detach-on-destroy on
set -g renumber-windows on
set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -g window-status-separator " "
set -g set-titles on
set -g set-titles-string "#S ● #I #{pane_current_command}"
set -g display-time 3000
set -g display-panes-time 1200
# Reserve a pane-border row below the bar without adding another status row.
set -g pane-border-status top
set -g pane-border-format ""
set -g pane-border-lines single
set -g popup-border-lines rounded

# Declare extkeys so Ghostty forwards modified keys using CSI-u rather than
# legacy ESC sequences. See README for the remaining Cmd+w limitation.
set -s extended-keys on
set -s extended-keys-format csi-u
# Reset before appending so prefix+r does not accumulate duplicate entries.
set -su terminal-features
set -as terminal-features ',xterm-ghostty*:RGB:usstyle:extkeys:hyperlinks,ghostty:RGB:usstyle:extkeys:hyperlinks'
# tmux copies reach the clipboard; direct application OSC 52 copies are blocked.
set -s set-clipboard external
# Needed by Neovim's Snacks image rendering; this does not force Pi images.
set -g allow-passthrough on
set -g allow-rename off
setw -g automatic-rename off
# Remove the retired naming plugin's hooks when reloading an existing server.
set-hook -gu 'after-new-window[8921]'
set-hook -gu 'after-select-window[8921]'
set-hook -gu 'after-rename-window[8921]'
set-hook -gu 'after-select-pane[8922]'
set-hook -gu 'after-new-window[8922]'
set-hook -gu 'after-split-window[8922]'
set-hook -gu 'client-session-changed[8922]'
set -gu @resurrect-hook-pre-restore-all
set -gu @resurrect-hook-post-restore-all
set -g bell-action other
set -g visual-bell off

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind t choose-tree -w -Z -f '#{==:#{session_name},#{client_session}}'
# Retire the custom fzf picker binding when reloading an existing server.
unbind -q T
bind o display-popup -E -d '#{pane_current_path}' -w 80% -h 70% -T sesh 'sesh picker -i'
bind r source-file ~/.config/tmux/tmux.conf \; display '  Config reloaded'
bind c new-window -c '#{pane_current_path}'
unbind -q |
bind v split-window -h -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind a last-window
bind C-p previous-window
bind C-n next-window
bind X confirm-before -p 'Kill window #W? (y/n)' kill-window

bind Space display-menu -T '#[align=centre] tmux ' -x C -y C \
  'Split right'       '|' "split-window -h -c '#{pane_current_path}'" \
  'Split down'        '-' "split-window -v -c '#{pane_current_path}'" \
  'New window'        'c' "new-window -c '#{pane_current_path}'" \
  '' \
  'Zoom pane'         'z' 'resize-pane -Z' \
  'Copy mode'         'v' 'copy-mode' \
  'Clear scrollback'  'C' 'clear-history' \
  'Save pane history' 'H' "command-prompt -p 'Save to:' -I '~/tmux-#S-#I.log' 'capture-pane -S -100000 ; save-buffer %%'" \
  'Break pane'        'b' 'break-pane -d' \
  'Paste buffers'     'P' 'choose-buffer -Z' \
  'Join pane'         'j' "choose-window 'join-pane -h -s %%'" \
  'Next layout'       'L' 'next-layout' \
  'Kill other panes'  'K' "confirm-before -p 'Kill all other panes in #W? (y/n)' 'kill-pane -a'" \
  '' \
  'Kill pane'         'x' "confirm-before -p 'Kill pane #P? (y/n)' 'kill-pane'" \
  'Kill window'       'X' "confirm-before -p 'Kill window #W? (y/n)' 'kill-window'" \
  '' \
  'Session tree'      't' 'choose-tree -Zw' \
  'Choose session'    's' 'choose-tree -s' \
  'Recall session'    'R' "display-popup -E -d '#{pane_current_path}' -w80% -h70% -T 'sesh' 'sesh picker -i'" \
  'Last session'      'o' 'switch-client -l' \
  'Rename session'    '$' "command-prompt -I '#S' 'rename-session %%'" \
  'Choose window'     'w' 'choose-window' \
  'Rename window'     ',' "command-prompt -I '#W' 'rename-window %%'" \
  'New session'       'n' "command-prompt -I 'home' 'new-session -Ad -s %% -c \"#{pane_current_path}\" \\; switch-client -t %%'" \
  '' \
  'Save session'      'C-s' "run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'" \
  'Restore session'   'C-r' "confirm-before -p 'Restore tmux session from last snapshot? (y/n)' \"run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'\"" \
  '' \
  'Toggle sync panes' 'S' 'setw synchronize-panes' \
  'Toggle status bar' 'T' 'set -g status' \
  'Toggle pane borders' 'B' "if -F '#{==:#{pane-border-status},off}' 'set -g pane-border-status top' 'set -g pane-border-status off'" \
  'Reload config'     'r' "source-file ~/.config/tmux/tmux.conf \\; display '  Config reloaded'"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T root MouseDrag1Pane if -Ft= '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -M'
bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
# Scroll history in ordinary panes; preserve mouse events for full-screen apps.
bind -T root WheelUpPane if -Ft= '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -e'
bind -T root WheelDownPane if -Ft= '#{pane_in_mode}' 'send -M' 'send -M'
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# TPM owns these writable checkouts. Catppuccin's release pin is intentional.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @floax-bind 'p'
set -g @floax-bind-menu 'P'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'
set -g @floax-title 'scratch'
set -g @floax-border-color '#cba6f7'
set -g @floax-text-color '#89b4fa'
set -g @fzf-url-bind 'u'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Clear the newer overrides on reload; Catppuccin only fills unset defaults.
set -gu @catppuccin_status_background
set -gu @catppuccin_window_number_position
set -gu @catppuccin_window_number_color
set -gu @catppuccin_window_current_number
set -gu @catppuccin_window_current_text_color
set -gu @catppuccin_window_current_number_color
set -gu @catppuccin_window_flags
set -gu @catppuccin_pane_active_border_style
set -gu @catppuccin_pane_border_style
set -gu @catppuccin_status_connect_separator
set -gu @catppuccin_status_left_separator
set -gu @catppuccin_status_right_separator

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'

# Load TPM last, then remove Resurrect's direct restore key so it cannot bypass
# confirmation in the command menu. The plugin path comes from environment.conf.
run-shell -b '"${TMUX_PLUGIN_MANAGER_PATH}tpm/tpm"; tmux unbind-key -q C-s; tmux unbind-key -q C-r'
