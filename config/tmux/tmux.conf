# ── Terminal ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# Reset before appending so repeated config reloads do not accumulate entries.
set -su terminal-features
set -as terminal-features ",xterm-ghostty*:RGB:usstyle:hyperlinks:extkeys"
# extkeys must be declared or tmux never asks Ghostty for extended keys, so
# alt+<printable> arrives as legacy ESC+key. Apps that negotiated the Kitty
# keyboard protocol only accept the CSI-u form and drop it (pi-tui keys.js
# gates the legacy branch on !kittyProtocolActive), which is what broke alt+o.
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
source-file -q ~/.config/tmux/environment.conf

# ── Core ───────────────────────────────────────────────────────────────────────
set -g history-limit 100000
set -g mouse on
set -g renumber-windows on
set -g detach-on-destroy off
set -g allow-rename off
setw -g automatic-rename off
set -s set-clipboard external
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
set -g display-time 3000
set -g display-panes-time 1200
set -g status-position top
set -g set-titles on
set -g set-titles-string "#S ● #I #{pane_current_command}"

# Inlined from tmux-plugins/tmux-sensible (unmaintained since 2024-03).
# Only the settings that were actually net-new on this machine; the rest of
# sensible was either a no-op against values set above or dead on tmux 3.6
# (escape-time already defaults to 10; reattach-to-user-namespace not installed).
set -g status-interval 15
set -g status-keys emacs
set -g focus-events on          # nvim autoread / FocusGained

# ── Keybindings ────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.config/tmux/tmux.conf \; display "  Config reloaded"
bind c new-window -c "#{pane_current_path}"
bind + resize-pane -Z
bind m if -F "#{mouse}" "set -g mouse off \; display 'mouse off'" "set -g mouse on \; display 'mouse on'"
bind o display-popup -E -d'#{pane_current_path}' -w80% -h70% -T'sesh' 'sesh picker -i'
bind Y run-shell "tmux set-buffer -- #{q:pane_current_path}"   # copy pane cwd
unbind -q F   # remove the old tmux-fzf binding when reloading a running server

# Splits (keep current path; | / - primary, % / " override tmux's cwd-less defaults)
bind | split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window management
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind x confirm-before -p "Kill pane #P? (y/n)" kill-pane
bind X confirm-before -p "Kill window #W? (y/n)" kill-window

# Inlined from tmux-plugins/tmux-sensible
bind a last-window
bind C-p previous-window
bind C-n next-window

# Command menu
bind Space display-menu -T "#[align=centre] tmux " -x C -y C \
  "Split right"       "|" "split-window -h -c '#{pane_current_path}'" \
  "Split down"        "-" "split-window -v -c '#{pane_current_path}'" \
  "New window"        "c" "new-window -c '#{pane_current_path}'" \
  "" \
  "Zoom pane"         "z" "resize-pane -Z" \
  "Copy mode"         "v" "copy-mode" \
  "Clear scrollback"  "C" "clear-history" \
  "Save pane history" "H" "command-prompt -p 'Save to:' -I '~/tmux-#S-#I.log' 'capture-pane -S -100000 ; save-buffer %%'" \
  "Break pane"        "b" "break-pane -d" \
  "Paste buffers"     "P" "choose-buffer -Z" \
  "Join pane"         "j" "choose-window 'join-pane -h -s %%'" \
  "Next layout"       "L" "next-layout" \
  "Kill other panes"  "K" "confirm-before -p 'Kill all other panes in #W? (y/n)' 'kill-pane -a'" \
  "" \
  "Kill pane"         "x" "confirm-before -p 'Kill pane #P? (y/n)' 'kill-pane'" \
  "Kill window"       "X" "confirm-before -p 'Kill window #W? (y/n)' 'kill-window'" \
  "" \
  "Session tree"      "t" "choose-tree -Zw" \
  "Choose session"    "s" "choose-tree -s" \
  "Recall session"    "R" "display-popup -E -d '#{pane_current_path}' -w80% -h70% -T 'sesh' 'sesh picker -i'" \
  "Last session"      "o" "switch-client -l" \
  "Rename session"    "$" "command-prompt -I '#S' 'rename-session %%'" \
  "Choose window"     "w" "choose-window" \
  "Rename window"     "," "command-prompt -I '#W' 'rename-window %%'" \
  "New session"       "n" "command-prompt -I 'home' 'new-session -Ad -s %% -c \"#{pane_current_path}\" \\; switch-client -t %%'" \
  "" \
  "Save session"      "C-s" "run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh'" \
  "Restore session"   "C-r" "confirm-before -p 'Restore tmux session from last snapshot? (y/n)' \"run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh'\"" \
  "" \
  "Toggle sync panes" "S" "setw synchronize-panes" \
  "Toggle status bar" "T" "set -g status" \
  "Toggle pane borders" "B" "if -F '#{==:#{pane-border-status},off}' 'set -g pane-border-status top' 'set -g pane-border-status off'" \
  "Reload config"     "r" "source-file ~/.config/tmux/tmux.conf \\; display '  Config reloaded'"

# ── Copy mode (vi) ─────────────────────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v              send-keys -X begin-selection
bind -T copy-mode-vi C-v            send-keys -X rectangle-toggle
bind -T copy-mode-vi H              send-keys -X start-of-line
bind -T copy-mode-vi L              send-keys -X end-of-line
bind -T copy-mode-vi Escape         send-keys -X cancel

# `set -s set-clipboard external` (above) reaches the system clipboard via
# OSC 52, so these replace tmux-yank's pbcopy pipe without the macOS-only path.
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X select-line \; send -X copy-selection-and-cancel

# Mouse selection should be owned by tmux, not by the terminal emulator, so
# dragging stays constrained to the pane under the pointer.
bind -T root MouseDrag1Pane if -Ft= "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -M"
bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Trackpad/mouse wheel scrolls tmux history in normal panes, while preserving
# mouse reporting for full-screen terminal apps such as nvim, less, and k9s.
bind -T root WheelUpPane if -Ft= "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send -M" "copy-mode -e"
bind -T root WheelDownPane if -Ft= "#{pane_in_mode}" "send -M" "send -M"
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# ── Pane borders ───────────────────────────────────────────────────────────────
set -g pane-border-lines single
set -g popup-border-lines rounded
set -g pane-border-status top
set -g pane-border-format ""

set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator " "
set -g status on

set -g @catppuccin_flavor "mocha"

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"

# Stock default is "basic" (flat); "rounded" restores the bubble separators,
# deriving their colour from the terminal background instead of hardcoding it.
set -g @catppuccin_window_status_style "rounded"

# Stock catppuccin uses #T (pane title); show the window name instead.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# ── Plugins (TPM-managed) ─────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @fzf-url-bind 'u'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Resurrect's direct restore key skips confirmation; save and restore live in
# the command menu instead.
run -b '~/.config/tmux/plugins/tpm/tpm; tmux unbind-key -q C-s; tmux unbind-key -q C-r'
